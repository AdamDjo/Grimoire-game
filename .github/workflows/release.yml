name: Release

on:
  push:
    branches: ["release/*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (ex: v1.2.3)"
        required: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: npm install -g pnpm@9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Type check
        run: pnpm lint && pnpm type-check

      - name: Build
        run: pnpm build

      - name: Extract and validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            # release/1.2.3 → 1.2.3
            BRANCH="$REF_NAME"
            RAW="${BRANCH#release/}"
          fi
          # Normalize: strip leading 'v' then re-add it
          VERSION="v${RAW#v}"
          # Enforce strict semver vX.Y.Z
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION'. Branch must follow release/X.Y.Z format."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version resolved: $VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Idempotent: a re-push on the release branch must not fail the job.
          # Without this, the "Open PR" step below is skipped and the release stalls.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists, retargeting it to ${GITHUB_SHA}"
            git tag -f "${VERSION}" "${GITHUB_SHA}"
            git push --force origin "refs/tags/${VERSION}"
          else
            gh release create "${VERSION}" \
              --title "Release ${VERSION}" \
              --generate-notes
          fi

      - name: Open PR release → main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          PR_BODY="## Release ${VERSION}

          This PR was automatically created by the release workflow.

          - Tag \`${VERSION}\` has been created
          - GitHub Release has been published
          - Merge this PR into \`main\` to complete the release

          After merging, sync \`develop\` via a PR — a squash merge rewrites history,
          so \`git merge origin/main\` into \`develop\` would raise add/add conflicts
          on every file. Port only the release tooling files instead:
          \`\`\`bash
          git checkout -b chore/sync-release-${VERSION} origin/develop
          git checkout origin/main -- apps/*/package.json packages/*/package.json
          \`\`\`"

          # Only skip when the PR genuinely exists — any other failure must fail the job.
          if [ -n "$(gh pr list --base main --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            echo "PR ${BRANCH} → main already open, nothing to do"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "release: ${VERSION}" \
            --body "${PR_BODY}" \
            --assignee "AdamDjo"
