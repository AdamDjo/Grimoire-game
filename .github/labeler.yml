"domain: frontend":
  - changed-files:
      - any-glob-to-any-file: ["apps/frontend/**"]

"domain: backend":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/backend/**"
          - "packages/shared/**"
          - "packages/eslint-config/**"
          - "packages/prettier-config/**"

"domain: ai":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/backend/src/ai/**"
          - "apps/backend/src/**/*prompt*"
          - "apps/backend/src/**/*provider*"
