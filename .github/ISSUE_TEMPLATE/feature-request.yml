name: "Feature Request"
description: "Proposer une nouvelle fonctionnalité"
title: "[FEATURE] "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description de la fonctionnalité
      description: "Décris clairement ce que tu veux ajouter et pourquoi."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Problème résolu
      description: "Quel problème ou besoin cette feature adresse-t-elle ?"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      placeholder: |
        - [ ] Critère 1
        - [ ] Critère 2
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domaine
      description: "Pose le label `domain: *` correspondant après création."
      options:
        - "domain: frontend"
        - "domain: backend"
        - "domain: ai"
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: "`predeploy` bloque la release courante, `postdeploy` la suit."
      options:
        - "phase: predeploy"
        - "phase: postdeploy"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dépendances
      description: "Issues ou PRs dont cette feature dépend (ex: #12, #15)"
    validations:
      required: false
